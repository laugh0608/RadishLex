[workspace]
members = [
    "crates/ime-cli",
    "crates/ime-core",
    "crates/ime-crypto",
    "crates/ime-engine-rime",
    "crates/ime-ffi",
    "crates/ime-product-install",
    "crates/ime-product-upgrade",
    "crates/ime-ranker",
    "crates/ime-runtime",
    "crates/ime-sync",
    "crates/ime-sync-runtime",
    "crates/ime-userdb",
    "platforms/macos-product/InstallAdapter",
    "platforms/macos-product/InstallCoordinatorAdapter",
    "platforms/macos-product/InstallerDriver",
    "platforms/macos-product/InstallerExecutor",
    "platforms/macos-product/InstallerBridge",
    "platforms/macos-product/UpgradeCoordinatorAdapter",
    "platforms/linux-product",
    "platforms/linux-l6-acceptance",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
repository = "https://github.com/laugh0608/RadishLex"

# History fault matrices repeatedly hash complete evidence files. Optimize only
# this existing dependency in tests; keep application code/debug checks intact.
[profile.test.package."sha2:0.10.9"]
opt-level = 3
