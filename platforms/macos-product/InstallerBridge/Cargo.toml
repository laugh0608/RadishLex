[package]
name = "radishlex-macos-installer-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license-file = "../../../LICENSE"
description = "Versioned native bridge for the RadishLex macOS Installer."

[lib]
name = "radishlex_macos_installer_bridge"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[dependencies]
radishlex-ime-product-install = { path = "../../../crates/ime-product-install" }
radishlex-ime-product-upgrade = { path = "../../../crates/ime-product-upgrade" }
radishlex-macos-installer-driver = { path = "../InstallerDriver" }
radishlex-macos-installer-executor = { path = "../InstallerExecutor" }
radishlex-macos-product-install = { path = "../InstallAdapter" }
radishlex-macos-upgrade-coordinator = { path = "../UpgradeCoordinatorAdapter" }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
