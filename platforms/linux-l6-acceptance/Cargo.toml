[package]
name = "radishlex-linux-l6-acceptance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license-file = "../../LICENSE"
description = "Compile-isolated Linux L6 checkpoint and evidence controller for RadishLex."

[dependencies]
radishlex-linux-product-install = { path = "../linux-product", features = ["l6-acceptance-checkpoints"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"

[[bin]]
name = "radishlex-linux-l6-acceptance"
path = "src/bin/radishlex-linux-l6-acceptance.rs"
