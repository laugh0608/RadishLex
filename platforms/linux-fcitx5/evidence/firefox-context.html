<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RadishLex Firefox 上下文取证</title>
  </head>
  <body>
    <main>
      <h1>RadishLex Firefox 上下文取证</h1>
      <p>本页完全离线，不包含脚本、表单提交或外部资源。请只输入公开合成文本。</p>

      <p>
        <label for="ordinary-field">普通字段</label><br />
        <input
          id="ordinary-field"
          type="text"
          autocomplete="off"
          spellcheck="false"
        />
      </p>

      <p>
        <label for="password-field">密码字段</label><br />
        <input
          id="password-field"
          type="password"
          autocomplete="off"
          spellcheck="false"
        />
      </p>
    </main>
  </body>
</html>
