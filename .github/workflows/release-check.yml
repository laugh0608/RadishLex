name: Release Checks

on:
  push:
    tags:
      - "v*-dev"
      - "v*-test"
      - "v*-release"

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      reliability: true
