name: PR Checks

on:
  pull_request:
    branches:
      - dev
      - master

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Validation Impact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      reliability: ${{ steps.impact.outputs.reliability }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select required specialists from the entire PR diff
        id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/validation_impact.py plan

  quality:
    needs: plan
    uses: ./.github/workflows/quality.yml
    with:
      reliability: ${{ needs.plan.outputs.reliability != 'false' }}

  candidate-quality:
    name: Candidate Quality
    if: always()
    needs: [plan, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the complete applicable quality result
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          [ "$PLAN_RESULT" = success ]
          [ "$QUALITY_RESULT" = success ]
          echo 'All applicable PR quality checks passed.'
