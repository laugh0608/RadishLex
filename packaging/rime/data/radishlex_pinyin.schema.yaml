# RadishLex product Rime schema
# encoding: utf-8
#
# This schema is maintained by RadishLex and distributed under Apache-2.0. Its
# spelling algebra is adapted from rime-pinyin-simp; RadishLex removed the
# upstream reverse-lookup and preset imports and added product-owned punctuation
# and key-binding behavior for the first product candidate.

schema:
  schema_id: radishlex_pinyin
  name: 萝卜词核拼音
  version: "1.0"
  author:
    - RadishLex contributors
  description: |
    RadishLex 首个 macOS 产品候选的本地简体全拼方案。
    不包含笔画反查或扩展符号表。

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 西文]
  - name: full_shape
    states: [半角, 全角]
  - name: ascii_punct
    states: [中文标点, 西文标点]

engine:
  processors:
    - ascii_composer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - erase/^hm$/
    - erase/^m$/
    - erase/^n$/
    - erase/^ng$/
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])u/$1v/
    - derive/un$/uen/
    - derive/ui$/uei/
    - derive/iu$/iou/
    - derive/([aeiou])ng$/$1gn/
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/
    - derive/ong$/on/
    - derive/ao$/oa/
    - derive/([iu])a(o|ng?)$/a$1$2/

translator:
  dictionary: pinyin_simp
  enable_sentence: true
  enable_user_dict: true
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

punctuator:
  full_shape:
    " ": {commit: "　"}
    ",": {commit: "，"}
    ".": {commit: "。"}
    "<": ["《", "〈"]
    ">": ["》", "〉"]
    "/": ["／", "÷"]
    "?": {commit: "？"}
    ";": {commit: "；"}
    ":": {commit: "："}
    "'": {pair: ["‘", "’"]}
    '"': {pair: ["“", "”"]}
    "\\": ["、", "＼"]
    "|": ["·", "｜"]
    "`": "｀"
    "~": "～"
    "!": {commit: "！"}
    "@": "＠"
    "#": "＃"
    "%": ["％", "°", "℃"]
    "$": ["￥", "$", "€", "£", "¥"]
    "^": {commit: "……"}
    "&": "＆"
    "*": ["＊", "·", "×"]
    "(": "（"
    ")": "）"
    "-": "－"
    "_": "——"
    "+": "＋"
    "=": "＝"
    "[": ["「", "【", "〔"]
    "]": ["」", "】", "〕"]
    "{": ["『", "〖"]
    "}": ["』", "〗"]
  half_shape:
    ",": {commit: "，"}
    ".": {commit: "。"}
    "<": ["《", "〈"]
    ">": ["》", "〉"]
    "/": ["、", "/", "／", "÷"]
    "?": {commit: "？"}
    ";": {commit: "；"}
    ":": {commit: "："}
    "'": {pair: ["‘", "’"]}
    '"': {pair: ["“", "”"]}
    "\\": ["、", "\\", "＼"]
    "|": ["·", "|", "｜"]
    "`": "`"
    "~": ["~", "～"]
    "!": {commit: "！"}
    "@": "@"
    "#": "#"
    "%": ["%", "％", "°", "℃"]
    "$": ["￥", "$", "€", "£", "¥"]
    "^": {commit: "……"}
    "&": "&"
    "*": ["*", "＊", "·", "×"]
    "(": "（"
    ")": "）"
    "-": "-"
    "_": "——"
    "+": "+"
    "=": "="
    "[": ["「", "【", "〔"]
    "]": ["」", "】", "〕"]
    "{": ["『", "〖"]
    "}": ["』", "〗"]

key_binder:
  bindings:
    - {when: has_menu, accept: minus, send: Page_Up}
    - {when: has_menu, accept: equal, send: Page_Down}
    - {when: paging, accept: comma, send: Page_Up}
    - {when: has_menu, accept: period, send: Page_Down}
