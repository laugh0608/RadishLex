[package]
name = "radishlex-ime-userdb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license-file = "../../LICENSE"
description = "Local user dictionary and learning event store for RadishLex."

[lib]
name = "radishlex_ime_userdb"
path = "src/lib.rs"

[dependencies]
radishlex-ime-crypto = { path = "../ime-crypto" }
radishlex-ime-sync = { path = "../ime-sync" }
rusqlite = { version = "0.39.0", features = ["backup", "bundled"] }
serde_json = "1.0.150"
sha2 = "0.10.9"

[dev-dependencies]
base64ct = { version = "1.8.3", features = ["alloc"] }
p256 = { version = "0.13.2", default-features = false, features = ["arithmetic", "std"] }
