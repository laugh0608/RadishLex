[package]
name = "radishlex-ime-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license-file = "../../LICENSE"
description = "C ABI boundary for RadishLex."

[lib]
name = "radishlex_ime_ffi"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = []
apple-keychain = [
    "dep:radishlex-ime-crypto",
    "radishlex-ime-crypto/apple-keychain",
]
native-rime = [
    "dep:radishlex-ime-engine-rime",
    "radishlex-ime-engine-rime/native-rime",
]

[dependencies]
radishlex-ime-core = { path = "../ime-core" }
radishlex-ime-crypto = { path = "../ime-crypto", optional = true, default-features = false }
radishlex-ime-engine-rime = { path = "../ime-engine-rime", optional = true, default-features = false }
radishlex-ime-ranker = { path = "../ime-ranker" }
radishlex-ime-product-upgrade = { path = "../ime-product-upgrade" }
radishlex-ime-runtime = { path = "../ime-runtime" }
radishlex-ime-sync-runtime = { path = "../ime-sync-runtime" }
radishlex-ime-userdb = { path = "../ime-userdb" }
serde_json = "1.0.150"
