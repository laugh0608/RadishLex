[package]
name = "radishlex-ime-sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license-file = "../../LICENSE"
description = "Sync payload boundary models for RadishLex."

[lib]
name = "radishlex_ime_sync"
path = "src/lib.rs"

[features]
default = []
apple-keychain = ["radishlex-ime-crypto/apple-keychain"]

[dependencies]
base64ct = { version = "1.8.3", features = ["alloc"] }
radishlex-ime-crypto = { path = "../ime-crypto" }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
webpki-roots = "1.0.8"

[dev-dependencies]
p256 = { version = "0.13.2", default-features = false, features = ["arithmetic", "std"] }
rcgen = "0.13.2"
